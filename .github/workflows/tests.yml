# SPDX-License-Identifier: MPL-2.0
name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression suite
        run: npm test
      - name: Check browser-only UI syntax
        run: node --check js/canonical-ui.js
